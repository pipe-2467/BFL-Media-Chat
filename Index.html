<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BFL Media Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background: #f0f2f5; display: flex; justify-content: center; padding: 12px; margin: 0; min-height: 100vh; }
    .card { background: white; padding: 20px; border-radius: 16px; width: 100%; max-width: 500px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); position: relative; }
    .hidden { display: none !important; }
    input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; outline: none; font-size: 15px; }
    button { width: 100%; padding: 12px; margin-top: 8px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 15px; color: white; transition: 0.2s; }
    button:active { opacity: 0.8; }
    .btn-guest { background: #6c757d; }
    .btn-login { background: #1a73e8; }
    .btn-call { background: #28a745; margin-bottom: 8px; }
    .btn-float { background: #ff9800; margin-bottom: 8px; }
    .avatar-preview { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid #1a73e8; margin: 0 auto 10px; display: block; }
    .header-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 1px solid #ddd; }
    .msg-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .action-link { font-size: 12px; color: #1a73e8; cursor: pointer; text-decoration: underline; margin-right: 8px; }
    #chat-box { height: 380px; overflow-y: auto; border: 1px solid #eee; padding: 12px; margin: 10px 0; border-radius: 10px; background: #fafafa; }
    .msg { margin-bottom: 10px; padding: 10px 12px; background: white; border-radius: 12px; border: 1px solid #e9ecef; display: flex; gap: 10px; align-items: flex-start; word-break: break-word; }
    .msg-system { text-align: center; margin: 8px 0; font-size: 12px; color: #666; background: #eef2f7; padding: 6px 12px; border-radius: 12px; display: block; }

    /* โครงสร้างหน้าต่างโทรปกติ */
    #call-container {
      position: relative;
      width: 100%;
      height: 320px;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 10px;
      background: #000;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    /* โครงสร้างหน้าต่างลอยการโทร (Floating PIP) */
    #call-container.floating {
      position: fixed;
      top: 30px;
      right: 15px;
      width: 170px;
      height: 240px;
      z-index: 99999;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      border: 2px solid #1a73e8;
      border-radius: 16px;
      touch-action: none;
    }

    .call-header-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 36px;
      background: rgba(0,0,0,0.75);
      z-index: 100000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
      color: white;
      font-size: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="card" id="selection-section">
  <h2 style="text-align: center; margin-top: 10px;">💬 BFL Media Chat</h2>
  <button class="btn-guest" onclick="showSection('guest-input')">👤 เข้าแบบผู้มาเยือน (Guest)</button>
  <button class="btn-login" onclick="showSection('email-input')">✉️ เข้าสู่ระบบ / สมัครด้วย อีเมล</button>
</div>

<div class="card hidden" id="guest-input">
  <h2 style="text-align:center;">ตั้งชื่อ & รูปโปรไฟล์</h2>
  <div style="text-align:center;">
    <img id="guest-avatar-img" class="avatar-preview" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
    <input type="file" id="avatar-file-guest" style="display:none;" accept="image/*" onchange="previewAvatar(this, 'guest-avatar-img')">
    <button type="button" class="btn-guest" style="width:auto; padding:6px 16px; margin:0 auto 10px;" onclick="document.getElementById('avatar-file-guest').click()">📷 เลือกรูปโปรไฟล์</button>
  </div>
  <input type="text" id="guest-name" placeholder="ระบุชื่อที่ต้องการใช้ในแชท...">
  <button class="btn-login" onclick="enterAsGuest()">เริ่มแชทเลย</button>
</div>

<div class="card hidden" id="email-input">
  <h2>เข้าสู่ระบบ / สมัครสมาชิก</h2>
  <input type="email" id="email" placeholder="ระบุ Email">
  <input type="password" id="pass" placeholder="ระบุ รหัสผ่าน">
  <button class="btn-login" onclick="authEmail('login')">เข้าสู่ระบบ</button>
  <button class="btn-guest" onclick="authEmail('signup')">สมัครสมาชิกใหม่</button>
</div>

<div class="card hidden" id="chat-section">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 10px;">
    <div style="display:flex; align-items:center; gap:10px;">
      <img id="user-header-avatar" class="header-avatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
      <div>
        <b id="user-display" style="display:block; font-size:14px;"></b>
        <span class="action-link" onclick="changeName()">✏️ เปลี่ยนชื่อ</span>
        <span class="action-link" onclick="document.getElementById('change-avatar-file').click()">📷 เปลี่ยนรูป</span>
      </div>
    </div>
    <input type="file" id="change-avatar-file" style="display:none;" accept="image/*" onchange="uploadNewAvatar(this)">
    <button onclick="logout()" style="width: auto; padding: 6px 12px; background: #dc3545; font-size: 12px; margin:0;">ออกจากห้อง</button>
  </div>

  <div style="display:flex; gap:8px;">
    <button class="btn-call" id="btn-toggle-call" onclick="startOrEndCall()">📞 เริ่ม/วาง สายโทรกลุ่ม</button>
    <button class="btn-float hidden" id="btn-float-call" onclick="toggleFloatCall()">📌 ลอยการโทร</button>
  </div>
  
  <div id="call-container" class="hidden">
    <div class="call-header-bar" id="call-drag-bar">
      <span>🔊 สายโทรกลุ่ม</span>
      <span style="cursor:pointer;" onclick="toggleFloatCall()">🔳 ขยาย/ย่อ</span>
    </div>
    <iframe id="call-frame" src="" allow="camera; microphone; display-capture; autoplay; fullscreen" style="width:100%; height:100%; border:none; padding-top:36px;"></iframe>
  </div>

  <div id="chat-box"></div>

  <div style="display: flex; gap: 6px;">
    <input type="text" id="msg-input" placeholder="พิมพ์ข้อความ..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button class="btn-login" style="width: 80px; margin:0;" onclick="sendMessage()">ส่ง</button>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://zdujhdwctclvwiwfbiyt.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpkdWpoZHdjdGNsdndpd2ZiaXl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MjEzODMsImV4cCI6MjEwMjA5NzM4M30.N1oUOJSZgZ-bUpBIObDeAr-OCiyLBuMPgAP3G6HIg-8";
  const CALL_ROOM_URL = "https://demo.daily.co/hello"; 

  const msgSound = new Audio("https://base44.app/api/apps/69f016f895905d8b1fec0f6a/files/mp/public/69f016f895905d8b1fec0f6a/ae37ddede_Chatmessage_notifica_4-1786765293216.mp3");
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let senderName = localStorage.getItem('chat_name') || "";
  let myAvatarUrl = localStorage.getItem('chat_avatar') || "https://cdn-icons-png.flaticon.com/512/149/149071.png";
  let inCall = false;
  let isFloating = false;

  window.addEventListener('DOMContentLoaded', () => {
    // ขอสิทธิ์การแจ้งเตือน
    if ("Notification" in window && Notification.permission !== "granted") {
      Notification.requestPermission();
    }
    // ขอสิทธิ์อุปกรณ์ ไมโครโฟน และ กล้องถ่ายรูปสำหรับแอป APK
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ audio: true, video: true }).catch(() => {});
    }
    
    if (senderName) {
      startChat();
    } else {
      showSection('selection-section');
    }
    makeDraggable(document.getElementById("call-container"));
  });

  function showSection(id) { 
    document.querySelectorAll('.card').forEach(c => c.classList.add('hidden')); 
    document.getElementById(id).classList.remove('hidden'); 
  }

  function startChat() { 
    showSection('chat-section'); 
    document.getElementById('user-display').innerText = senderName; 
    document.getElementById('user-header-avatar').src = myAvatarUrl;
    loadMessages(); 
    subscribeRealtime(); 
  }

  function enterAsGuest() { 
    const gName = document.getElementById('guest-name').value.trim();
    if(!gName) return alert("ระบุชื่อก่อนครับ");
    senderName = gName + " (Guest)"; 
    localStorage.setItem('chat_name', senderName);
    localStorage.setItem('chat_avatar', myAvatarUrl);
    startChat(); 
  }

  function changeName() {
    const newName = prompt("ใส่ชื่อใหม่ที่ต้องการใช้:", senderName);
    if (newName && newName.trim() !== "") {
      senderName = newName.trim();
      localStorage.setItem('chat_name', senderName);
      document.getElementById('user-display').innerText = senderName;
    }
  }

  function logout() { 
    localStorage.removeItem('chat_name'); 
    localStorage.removeItem('chat_avatar'); 
    senderName = "";
    myAvatarUrl = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
    showSection('selection-section');
  }

  async function uploadNewAvatar(input) {
    if (!input.files[0]) return;
    const file = input.files[0];
    const fileName = `${Date.now()}_${file.name}`;
    const { data, error } = await supabaseClient.storage.from('chat-files').upload(fileName, file);
    if (error) return alert("อัปโหลดรูปไม่สำเร็จ");
    const { data: publicUrlData } = supabaseClient.storage.from('chat-files').getPublicUrl(fileName);
    myAvatarUrl = publicUrlData.publicUrl;
    localStorage.setItem('chat_avatar', myAvatarUrl);
    document.getElementById('user-header-avatar').src = myAvatarUrl;
  }

  function previewAvatar(input, imgId) {
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = (e) => { 
        document.getElementById(imgId).src = e.target.result; 
        myAvatarUrl = e.target.result; 
      };
      reader.readAsDataURL(input.files[0]);
    }
  }

  async function sendMessage() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    await supabaseClient.from('massages').insert([{ 
      sender: senderName, 
      text: text, 
      avatar_url: myAvatarUrl, 
      type: 'chat' 
    }]);
  }

  function appendMsg(msg) {
    const box = document.getElementById('chat-box');
    if (msg.sender === "System") {
      const sysDiv = document.createElement('div');
      sysDiv.className = "msg-system";
      sysDiv.innerText = msg.text;
      box.appendChild(sysDiv);
    } else {
      const msgDiv = document.createElement('div');
      msgDiv.className = "msg";
      msgDiv.innerHTML = `
        <img src="${msg.avatar_url || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" class="msg-avatar">
        <div style="width:100%;">
          <b style="color:#1a73e8; font-size:13px;">${msg.sender}</b>
          <div style="font-size:14px; color:#333;">${msg.text}</div>
        </div>
      `;
      box.appendChild(msgDiv);
    }
    box.scrollTop = box.scrollHeight;
  }

  function subscribeRealtime() {
    supabaseClient.channel('realtime').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'massages' }, payload => {
      const newMsg = payload.new;
      appendMsg(newMsg);
      msgSound.play().catch(() => {});

      if (document.hidden && Notification.permission === "granted") {
        if (newMsg.type === 'call_start') {
          new Notification("📞 สายโทรกลุ่ม", { body: `${newMsg.caller || 'เพื่อน'} เริ่มโทรกลุ่มแล้ว` });
        } else if (newMsg.type === 'chat') {
          new Notification(newMsg.sender, { body: newMsg.text });
        }
      }
    }).subscribe();
  }

  async function loadMessages() { 
    const { data } = await supabaseClient.from('massages').select('*').order('created_at', { ascending: true }); 
    if (data) {
      document.getElementById('chat-box').innerHTML = "";
      data.forEach(appendMsg); 
    }
  }

  async function startOrEndCall() {
    inCall = !inCall;
    const container = document.getElementById('call-container');
    const frame = document.getElementById('call-frame');
    const floatBtn = document.getElementById('btn-float-call');
    
    if (inCall) {
      container.classList.remove('hidden');
      floatBtn.classList.remove('hidden');
      frame.src = CALL_ROOM_URL;
      
      await supabaseClient.from('massages').insert([{
        sender: "System",
        caller: senderName,
        text: `📞 ${senderName} เริ่มโทรกลุ่มแล้ว`,
        type: 'call_start'
      }]);
    } else {
      container.classList.add('hidden');
      floatBtn.classList.add('hidden');
      container.classList.remove('floating');
      isFloating = false;
      frame.src = "";
      
      await supabaseClient.from('massages').insert([{
        sender: "System",
        text: "🛑 การโทรกลุ่มสิ้นสุดลงแล้ว",
        type: 'call_end'
      }]);
    }
  }

  function toggleFloatCall() {
    const container = document.getElementById('call-container');
    isFloating = !isFloating;
    if (isFloating) {
      container.classList.add('floating');
    } else {
      container.classList.remove('floating');
      container.style.top = "";
      container.style.left = "";
      container.style.right = "";
    }
  }

  function makeDraggable(elmnt) {
    let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
    const header = document.getElementById("call-drag-bar");
    if (header) {
      header.onmousedown = dragMouseDown;
      header.ontouchstart = dragTouchStart;
    }

    function dragMouseDown(e) {
      if (!isFloating) return;
      e.preventDefault();
      pos3 = e.clientX;
      pos4 = e.clientY;
      document.onmouseup = closeDragElement;
      document.onmousemove = elementDrag;
    }

    function elementDrag(e) {
      e.preventDefault();
      pos1 = pos3 - e.clientX;
      pos2 = pos4 - e.clientY;
      pos3 = e.clientX;
      pos4 = e.clientY;
      elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
      elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
    }

    function dragTouchStart(e) {
      if (!isFloating) return;
      const touch = e.touches[0];
      pos3 = touch.clientX;
      pos4 = touch.clientY;
      document.ontouchend = closeDragElement;
      document.ontouchmove = elementTouchMove;
    }

    function elementTouchMove(e) {
      const touch = e.touches[0];
      pos1 = pos3 - touch.clientX;
      pos2 = pos4 - touch.clientY;
      pos3 = touch.clientX;
      pos4 = touch.clientY;
      elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
      elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
    }

    function closeDragElement() {
      document.onmouseup = null;
      document.onmousemove = null;
      document.ontouchend = null;
      document.ontouchmove = null;
    }
  }
</script>
</body>
</html>
