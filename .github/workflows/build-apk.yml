name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Prepare Web Directory & Capacitor Config
        run: |
          mkdir -p www
          # ค้นหาไฟล์ index.html (ไม่สนตัวพิมพ์เล็ก-ใหญ่) แล้วก๊อปปี้ไปไว้ใน www
          find . -maxdepth 2 -iname "index.html" -exec cp {} www/index.html \;
          echo '{"appId":"com.bflmedia.chat","appName":"BFL Media Chat","webDir":"www"}' > capacitor.config.json

      - name: Build Android Project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true
          cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml || true
          npx cap copy android
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: "BFL-Chat-APK"
          path: "android/app/build/outputs/apk/debug/app-debug.apk"
